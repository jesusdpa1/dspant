[project]
name = "dspant-viz"
version = "0.1.0"
description = "Multi-backend visualization library for electrophysiology data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dash>=4.4.1",
    "dask>=2026.8.0",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbformat>=5.11.1",
    "numpy>=2.5.4",
    "plotly>=6.9.0",
    "plotly-resampler>=0.11.1",
    "seaborn>=0.13.2",
    "streamlit>=1.66.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.17.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
]

[project.scripts]
dspant-viz = "dspant_viz:main"

[tool.maturin]
module-name = "dspant_viz._rs"
python-packages = ["dspant_viz"]
python-source = "src"
manifest-path = "./rust/Cargo.toml"

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"
