[project]
name = "dspant"
version = "0.1.0"
description = "DSPANT: Digital Signal Processing for Analysis Toolkit"
readme = "README.md"
authors = [{ name = "Jesús Peñaloza", email = "jesus.penalozaa@ufl.edu" }]
requires-python = ">=3.12"


dependencies = [
    "colorspace>=1.0.0",
    "dask-ml>=2025.1.0",
    "dask[complete]>=2026.8.0",
    "graphviz>=0.21",
    "h5py>=3.16.0",
    "ipycytoscape>=1.3.3",
    "librosa>=1.0.0",
    "matplotlib>=3.11.2",
    "mkl-service>=2.8.0; sys_platform != 'darwin'",
    "neo>=0.14.6",
    "numpy>=2.5.4",
    "numba>=0.68.0",
    "pendulum>=3.3.0",
    "plotly-resampler>=0.11.1",
    "polars>=2.0.0",
    "pyarrow==26.0.0",
    "pydantic>=2.14.1",
    "pywavelets>=1.10.0",
    # "rerun-sdk>=0.23.3",
    "rich>=15.0.0",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "ssqueezepy>=0.6.6",
    "tdt>=0.7.6",
    "toml>=0.10.2",
    "zarr>=3.4.1",
    "zarrs>=0.2.3",
    "numcodecs>=0.17.0",
    "ipywidgets>=8.1.9",
    "rastermap>=1.0",
]

[project.scripts]
dspant = "dspant:main"

# Reorganize optional dependencies into logical groups
[project.optional-dependencies]

# Extension packages
emgproc = ["dspant-emgproc==0.1.0"]
neuroproc = ["dspant-neuroproc==0.1.0"]
viz = ["dspant-viz==0.1.0"]

# Documentation tools
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.7",
    "mkdocs-autorefs>=1.4.4",
]

# CPU-only PyTorch
cpu = ["torch>=2.14.1", "torchaudio>=2.11.0"]

# CUDA-enabled PyTorch
cu128 = [
    "torch>=2.11.0; sys_platform == 'win32' or sys_platform == 'linux'",
    "torchaudio>=2.11.0; sys_platform == 'win32' or sys_platform == 'linux'",
    "torch>=2.11.0; sys_platform == 'darwin'",
    "torchaudio>=2.11.0; sys_platform == 'darwin'",
]

# All extensions combined
all = [
    "dspant-emgproc==0.1.0",
    "dspant-neuroproc==0.1.0",
    "dspant-viz==0.1.0",
    "torch>=2.11.0; sys_platform == 'win32' or sys_platform == 'linux'",
    "torchaudio>=2.11.0; sys_platform == 'win32' or sys_platform == 'linux'",
    "ipykernel>=7.4.0",
    "python-dotenv>=1.2.4",
    "ruff>=0.17.1",
]

dev = [
    # Development tools
    "ipykernel>=7.4.0",
    "python-dotenv>=1.2.4",
    "ruff>=0.17.1",
]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "dspant._rs"
python-packages = ["dspant"]
python-source = "src"
manifest-path = "./rust/Cargo.toml"

# uv-specific configurations
[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }]]

cache-keys = [
    { file = "pyproject.toml" },
    { file = "./rust/Cargo.toml" },
    { file = "**/*.rs" },
]

[tool.uv.sources]
# CPU version
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

dspant-emgproc = [{ workspace = true }]
dspant-neuroproc = [{ workspace = true }]
dspant-viz = [{ workspace = true }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.workspace]
members = [
    "./dspant_emgproc",
    "./dspant_neuroproc",
    "./dspant_app",
    "./dspant_viz",
]
